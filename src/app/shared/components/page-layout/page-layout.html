<section class="flex flex-col w-full h-full min-h-0 bg-base-100">
  <ng-content select="[header], app-page-header" />

  <main
    class="flex-1 flex flex-col min-h-0 overflow-y-auto"
    [class.p-4]="!flush()"
    [class.sm:p-6]="!flush()"
  >
    <ng-content select="[content]"></ng-content>
    <ng-content></ng-content>
  </main>

  <ng-content select="[footer]" />
</section>

<header class="flex items-center justify-between px-4 md:px-6 h-14 border-b border-base-200 bg-base-100/80 backdrop-blur-md sticky top-0 z-30 select-none">
  <div class="flex items-center gap-3 min-w-0">
    <!-- Mobile Hamburger Button -->
    <button class="md:hidden btn btn-ghost btn-sm btn-square text-base-content shrink-0"
      (click)="sidebarService.toggleMobile()"
      title="Abrir menú de navegación">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>

    <!-- Breadcrumb Indicator (Subtle & Clean) -->
    <div class="flex items-center gap-2 text-xs text-base-content/50 font-medium truncate">
      <span class="hover:text-base-content transition-colors">Panel</span>
      <span class="text-base-content/30">/</span>
      <span class="text-base-content/80 font-semibold truncate">{{ navbarTitle().title }}</span>
    </div>
  </div>

  <div class="flex items-center gap-3 shrink-0">
    <!-- WebSocket Status -->
    <div class="flex items-center gap-2 px-2.5 py-1 rounded-lg text-xs font-medium bg-base-200/80 border border-base-200">
      <div class="w-2 h-2 rounded-full"
        [class.bg-emerald-500]="wsConnected"
        [class.bg-red-500]="!wsConnected">
      </div>
      <span class="text-base-content/60 text-[11px]">
        {{ wsConnected ? 'Online' : 'Offline' }}
      </span>
    </div>

    <!-- Theme Toggle -->
    <button class="btn btn-ghost btn-sm btn-square" (click)="toggleTheme()"
      [title]="isDark ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'">
      @if (isDark) {
      <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
      </svg>
      } @else {
      <svg class="w-4 h-4 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
      </svg>
      }
    </button>

    <!-- Notifications -->
    <app-notifications />

    <!-- User Dropdown -->
    <app-user-dropdown />
  </div>
</header>

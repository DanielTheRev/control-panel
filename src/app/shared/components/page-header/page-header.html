<header class="w-full px-4 sm:px-6 py-3 border-b border-base-300/80 bg-base-100 shrink-0 flex flex-col gap-2.5">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
    <div class="flex flex-wrap items-center gap-3 sm:gap-4 min-w-0 flex-1">
      <div class="min-w-0">
        <div class="flex items-center gap-2 min-w-0">
          <h1 class="m-0 text-base sm:text-lg font-bold text-base-content tracking-tight truncate">
            {{ title() }}
          </h1>

          @if (subtitle() && inlineSubtitle()) {
            <span class="text-xs text-base-content/50 font-medium hidden md:inline truncate">
              · {{ subtitle() }}
            </span>
          }
        </div>

        @if (subtitle()) {
          <p
            class="text-xs text-base-content/55 mt-0.5 font-medium truncate"
            [class.md:hidden]="inlineSubtitle()"
          >
            {{ subtitle() }}
          </p>
        }
      </div>

      <ng-content select="[header-inline]"></ng-content>
    </div>

    <div class="flex flex-wrap sm:flex-nowrap items-center gap-2 shrink-0">
      <ng-content select="[actions]"></ng-content>
    </div>
  </div>

  <div class="w-full max-w-full overflow-x-auto no-scrollbar empty:hidden">
    <ng-content select="[sub-menu]"></ng-content>
  </div>
</header>

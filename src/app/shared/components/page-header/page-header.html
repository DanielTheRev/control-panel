<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 sm:gap-6 border-b border-base-300 p-3 sm:p-6 {{ withMB() ? 'mb-2' : '' }}">
  <div class="flex-1 min-w-0">
    <h1 class="m-0 text-base sm:text-xl font-bold text-base-content tracking-wide truncate">
      {{ title() }}
    </h1>

    @if (subtitle()) {
    <p class="text-xs sm:text-sm text-base-content/50 mt-0.5 sm:mt-1 truncate">
      {{ subtitle() }}
    </p>
    }
  </div>

  <div class="flex flex-wrap sm:flex-nowrap items-center gap-2 sm:gap-3 w-full sm:w-auto mt-1 sm:mt-0">
    <ng-content select="[actions]"></ng-content>
  </div>
</div>

<div class="w-full max-w-full overflow-x-auto custom-scrollbar border-b border-base-200/60">
  <ng-content select="[sub-menu]"></ng-content>
</div>

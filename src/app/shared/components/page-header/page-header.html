<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 sm:gap-6 pb-2 {{ withMB() ? 'mb-1' : '' }}">
  <div class="flex-1 min-w-0">
    <h1 class="m-0 text-xl sm:text-2xl font-black text-base-content tracking-tight truncate">
      {{ title() }}
    </h1>

    @if (subtitle()) {
      <p class="text-xs sm:text-sm text-base-content/50 mt-0.5 font-medium truncate">
        {{ subtitle() }}
      </p>
    }
  </div>

  <div class="flex flex-wrap sm:flex-nowrap items-center gap-2 sm:gap-3 w-full sm:w-auto mt-1 sm:mt-0">
    <ng-content select="[actions]"></ng-content>
  </div>
</div>

<div class="w-full max-w-full overflow-x-auto custom-scrollbar pb-1">
  <ng-content select="[sub-menu]"></ng-content>
</div>

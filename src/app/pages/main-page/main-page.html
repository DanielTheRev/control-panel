<div class="flex h-screen w-full overflow-hidden bg-base-200">
  <!-- 1. DESKTOP / TABLET SIDEBAR (FLEX SHRINK-0) -->
  <app-sidebar class="hidden md:flex flex-col shrink-0 h-full" />

  <!-- 2. MOBILE DRAWER (OVERLAY SLIDE-OVER) -->
  @if (sidebarService.SidebarStatus().isMobileOpen) {
    <!-- Backdrop -->
    <div
      class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 md:hidden transition-opacity duration-300 animate-fade-in"
      (click)="sidebarService.closeMobile()"
    ></div>

    <!-- Mobile Drawer Content -->
    <app-sidebar
      [isMobile]="true"
      class="fixed inset-y-0 left-0 w-72 max-w-[85vw] z-50 md:hidden flex flex-col shadow-2xl animate-slide-right select-none"
    />
  }

  <!-- 3. MAIN WORKSPACE (FLEX-1 MIN-W-0) -->
  <div class="flex-1 min-w-0 flex flex-col h-full overflow-hidden">
    <app-navbar />
    <main class="flex-1 min-w-0 overflow-y-auto p-3 sm:p-5 flex flex-col">
      <router-outlet />
    </main>
  </div>
</div>
